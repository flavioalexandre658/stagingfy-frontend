<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Teste Stagingfy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <h1>Teste Stagingfy</h1>

    <!-- Loader stub apontando para o embed.js local -->
    <script>
        (function () {
            if (!window.stagingfy || window.stagingfy("getState") !== "initialized") {
                window.stagingfy = function () { (window.stagingfy.q = window.stagingfy.q || []).push(arguments) };
                window.stagingfy = new Proxy(window.stagingfy, { get: (t, p) => p === "q" ? t.q : (...a) => t(p, ...a) });
            }
            function onLoad() {
                var s = document.createElement("script");
                s.src = "embed.min.js";   /* ou embed.min.js */
                s.id = "stagingfy-loader";
                document.body.appendChild(s);
            }
            if (document.readyState === "complete") onLoad();
            else window.addEventListener("load", onLoad);
        })();
    </script>

    <!-- chama o open com o UUID -->
    <script>
        stagingfy("open", { slug: "demo" });
    </script>
</body>

</html>
